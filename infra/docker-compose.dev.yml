services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rayaan
      POSTGRES_PASSWORD: rayaan
      POSTGRES_DB: rayaan_hotel
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
