name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rayaan
          POSTGRES_PASSWORD: rayaan
          POSTGRES_DB: rayaan_hotel_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379

    env:
      DATABASE_URL: postgresql://rayaan:rayaan@localhost:15432/rayaan_hotel_test
      REDIS_URL: redis://localhost:16379
      CLERK_SECRET_KEY: test_clerk_secret_key
      CLERK_WEBHOOK_SIGNING_SECRET: test_clerk_webhook_secret
      CLERK_JWT_KEY: test_clerk_jwt_key
      CLERK_JWT_ISSUER: https://example.clerk.accounts.dev
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /app
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /onboarding
      STRIPE_SECRET_KEY: sk_test_placeholder
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      PAYSTACK_CALLBACK_URL: http://localhost:3000/app/payments/callback

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

